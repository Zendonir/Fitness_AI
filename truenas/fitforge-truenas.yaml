# FitForge – TrueNAS Scale: Apps → Discover Apps → ⋮ → "Install via YAML"
# Einfach komplett einfügen – keine Anpassungen nötig.
#  • Schlüssel (App, Verschlüsselung, Web-Push, Datenbank-Passwort) erzeugt der Container
#    "fitforge-init" beim ersten Start selbst und speichert sie im Volume "secrets".
#  • Das erste Konto, das du im Browser registrierst, wird Administrator.
#  • Erreichbar unter http://<TrueNAS-IP>:30850 – für HTTPS in Nginx Proxy Manager
#    einen Proxy-Host auf <TrueNAS-IP>:30850 anlegen (Websockets an, "proxy_buffering off;").
#  • KI-Keys, Registrierung usw. stellst du danach im Admin-Panel ein.
# Optional: Daten statt in Docker-Volumes in ein Dataset legen → unten bei "volumes:" die
# Zeilen mit /mnt/... einkommentieren und die Volume-Zeilen darüber entfernen.

x-fitforge: &fitforge
  image: ghcr.io/zendonir/fitness_ai:latest
  restart: unless-stopped
  environment:
    TZ: Europe/Berlin
    PUID: "568"
    PGID: "568"
    REDIS_URL: redis://redis:6379/0
  volumes:
    - secrets:/data/secrets
    - uploads:/data/uploads
    - backups:/data/backups
    # - /mnt/tank/apps/fitforge/secrets:/data/secrets
    # - /mnt/tank/apps/fitforge/uploads:/data/uploads
    # - /mnt/tank/apps/fitforge/backups:/data/backups

services:
  init:
    <<: *fitforge
    container_name: fitforge-init
    restart: "no"
    command: ["init"]

  postgres:
    image: postgres:16-alpine
    container_name: fitforge-postgres
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      POSTGRES_DB: fitforge
      POSTGRES_USER: fitforge
      POSTGRES_PASSWORD_FILE: /secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - secrets:/secrets:ro
      - postgres:/var/lib/postgresql/data
      # - /mnt/tank/apps/fitforge/secrets:/secrets:ro
      # - /mnt/tank/apps/fitforge/postgres:/var/lib/postgresql/data
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitforge -d fitforge"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fitforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "300", "10"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    <<: *fitforge
    container_name: fitforge-app
    command: ["app"]
    ports:
      - "30850:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    <<: *fitforge
    container_name: fitforge-worker
    command: ["worker"]
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "arq", "app.worker.WorkerSettings", "--check"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  secrets:
  uploads:
  backups:
  postgres:
  redis:
