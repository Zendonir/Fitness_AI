name: CI
on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: fitforge, POSTGRES_PASSWORD: fitforge, POSTGRES_DB: fitforge_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fitforge" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://fitforge:fitforge@localhost:5432/fitforge_test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run check && npm run build
        working-directory: frontend
